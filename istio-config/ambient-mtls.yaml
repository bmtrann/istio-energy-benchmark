apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: permissive-transport
  namespace: default
spec:
  mtls:
    mode: PERMISSIVE # Opens the door to plaintext traffic on the network wire
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: strict-by-identity
  namespace: default
spec:
  action: ALLOW
  rules:
    # Rule 1: Enforce strict mTLS for all regular internal service-to-service communication
    - from:
        - source:
            principals: ["cluster.local/*"]
    # Rule 2: Carve out the exception cleanly for the isolated k6 namespace
    - from:
        - source:
            ipBlocks: ["10.42.0.0/16"]