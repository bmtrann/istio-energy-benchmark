apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
    name: default
    namespace: istio-system
spec:
    mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
name: permissive-k6-runners
namespace: default
spec:
selector:
    matchLabels:
    runner: "true"
mtls:
    mode: PERMISSIVE